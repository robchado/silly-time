name: Check flight providers (temporary)
on: [push, workflow_dispatch]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - run: |
          ORIGIN="https://robchado.github.io"
          for u in \
            "https://api.adsb.lol/v2/point/34.05/-118.25/15" \
            "https://api.airplanes.live/v2/point/34.05/-118.25/15" \
            "https://opendata.adsb.fi/api/v2/lat/34.05/lon/-118.25/dist/15" \
            "https://opensky-network.org/api/states/all?lamin=33.8&lomin=-118.5&lamax=34.3&lomax=-118.0&extended=1" ; do
            echo "=================== $u"
            curl -sS -m 20 -o body.txt -D headers.txt -H "Origin: $ORIGIN" -w "HTTP %{http_code}\n" "$u" || true
            grep -i -E '^(access-control|content-type|server|x-ratelimit|retry-after)' headers.txt || echo "(no CORS headers)"
            echo "--- preflight"
            curl -sS -m 20 -o /dev/null -D - -X OPTIONS -H "Origin: $ORIGIN" -H "Access-Control-Request-Method: GET" "$u" | grep -i -E '^(HTTP|access-control)' || true
            echo "--- body"; head -c 300 body.txt; echo
          done
